<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aukmind Tools: private, in-browser file tools</title>
    <meta name="description" content="Free image, PDF and LinkedIn text tools that run entirely in your browser. Your files are never uploaded.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://aukmind.com/tools.html">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
    <style>
        html, body { height: 100%; }
        body { height: 100dvh; display: flex; overflow: hidden; background: var(--white); }

        .sidebar {
            --w: 264px;
            width: var(--w); flex: none; position: relative; z-index: 20;
            display: flex; flex-direction: column;
            background: var(--white); border-right: 1px solid var(--line);
            transition: width .2s ease;
        }
        .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 1rem 1rem .75rem 1.1rem; }
        /* Handle sits on the sidebar's border */
        #collapseToggle {
            position: absolute; top: 1.35rem; right: -12px; z-index: 30;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow);
        }
        #collapseToggle svg { width: 14px; height: 14px; }
        #collapseToggle:hover { border-color: var(--ink-2); }
        .icon-btn {
            width: 34px; height: 34px; flex: none; border-radius: 4px;
            display: grid; place-items: center; color: var(--muted);
            transition: background-color .15s, color .15s;
        }
        .icon-btn:hover { background: var(--bg); color: var(--ink); }
        .icon-btn svg { width: 18px; height: 18px; }

        .nav-label { padding: .75rem 1.25rem .4rem; font-size: .75rem; font-weight: 500; color: var(--muted); }
        .nav { flex: 1; overflow-y: auto; padding: 0 .6rem; display: flex; flex-direction: column; gap: 2px; }
        .tool-link {
            position: relative; display: flex; align-items: center; gap: .75rem;
            padding: .6rem .65rem; border-radius: 4px; color: var(--ink-2);
            transition: background-color .15s, color .15s;
        }
        .tool-link:hover { background: var(--bg); color: var(--ink); }
        .tool-icon {
            width: 36px; height: 36px; flex: none; border-radius: 4px;
            display: grid; place-items: center;
            background: var(--bg); color: var(--muted); border: 1px solid var(--line);
            transition: inherit;
        }
        .tool-icon svg { width: 18px; height: 18px; }
        .tool-text { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
        .tool-name { font-weight: 600; font-size: .9rem; }
        .tool-desc { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tool-link[aria-current="page"] { background: var(--blue-50); color: var(--blue-700); }
        .tool-link[aria-current="page"] .tool-icon { background: var(--navy); border-color: var(--navy); color: #fff; }

        .sidebar-foot { padding: 1rem 1.1rem; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: .6rem; font-size: .75rem; color: var(--muted); }
        .sidebar-foot a:hover { color: var(--blue-600); }
        .foot-row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }

        /* Collapsed desktop rail: icons only */
        .sidebar.collapsed { --w: 68px; }
        .sidebar.collapsed .sidebar-head { justify-content: center; padding: 1rem .5rem .75rem; }
        .sidebar.collapsed .brand-mark { width: 32px; height: 32px; }
        .sidebar.collapsed .brand-word,
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed .tool-text,
        .sidebar.collapsed .sidebar-foot .hide-collapsed { display: none; }
        /* visible, or the tooltips below make the rail scroll sideways */
        .sidebar.collapsed .nav { padding: .5rem .5rem 0; align-items: center; overflow: visible; }
        .sidebar.collapsed .tool-link { padding: .35rem; }
        .sidebar.collapsed .sidebar-foot { align-items: center; padding: .75rem .5rem; }
        .sidebar.collapsed .privacy-pill { padding: .4rem; }
        .sidebar.collapsed .privacy-pill span { display: none; }
        .sidebar.collapsed .collapse-icon { transform: rotate(180deg); }
        .collapse-icon { transition: transform .2s; }

        /* Tooltip for the rail */
        .sidebar.collapsed .tool-link::after {
            content: attr(data-name);
            position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
            background: var(--ink); color: #fff; font-size: .75rem; font-weight: 600;
            padding: .3rem .55rem; border-radius: 6px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 60;
        }
        .sidebar.collapsed .tool-link:hover::after,
        .sidebar.collapsed .tool-link:focus-visible::after { opacity: 1; }

        main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; background: var(--bg); }
        #toolFrame { flex: 1; width: 100%; border: 0; background: var(--white); }
        .loader {
            position: absolute; inset: 0; display: grid; place-items: center;
            background: var(--white); transition: opacity .2s; z-index: 5;
        }
        .loader.done { opacity: 0; pointer-events: none; }
        .loader-inner { display: flex; flex-direction: column; align-items: center; gap: .9rem; color: var(--muted); font-size: .9rem; }
        .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--blue-100); border-top-color: var(--blue-600); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .mobile-bar, .backdrop, .sheet-grip { display: none; }

        @media (max-width: 767px) {
            body { flex-direction: column; }
            main { order: 1; }
            .mobile-bar {
                order: 2; flex: none; display: flex; align-items: center; gap: .75rem;
                height: calc(3.75rem + env(safe-area-inset-bottom)); padding: 0 .75rem env(safe-area-inset-bottom);
                background: var(--white); border-top: 1px solid var(--line);
                box-shadow: 0 -4px 16px -8px rgba(15, 23, 42, .15); z-index: 50;
            }
            .mobile-bar .brand-mark { width: 30px; height: 30px; }
            .current-tool {
                flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: .5rem;
                padding: .55rem .85rem; border-radius: 4px; background: var(--bg); border: 1px solid var(--line);
                font-weight: 600; font-size: .9rem; text-align: left;
            }
            .current-tool svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
            .current-tool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

            .sidebar, .sidebar.collapsed {
                --w: 100%;
                position: fixed; left: 0; right: 0; bottom: calc(3.75rem + env(safe-area-inset-bottom));
                max-height: 75dvh; border-right: 0;
                border-radius: 8px 8px 0 0; box-shadow: 0 -12px 32px -12px rgba(15, 23, 42, .3);
                transform: translateY(calc(100% + 5rem)); transition: transform .25s ease;
                z-index: 40;
            }
            .sidebar.open { transform: translateY(0); }
            .sheet-grip { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: .6rem auto 0; }
            .sidebar-head { display: none; }
            /* Rail mode is a desktop thing; the sheet always shows full entries */
            .sidebar.collapsed .nav-label, .sidebar.collapsed .tool-text { display: flex; }
            .sidebar.collapsed .nav-label { display: block; }
            .sidebar.collapsed .nav { align-items: stretch; padding: 0 .6rem; overflow-y: auto; }
            .sidebar.collapsed .tool-link { padding: .6rem .65rem; }
            .sidebar.collapsed .tool-link::after { display: none; }
            .sidebar.collapsed .sidebar-foot { align-items: stretch; padding: 1rem 1.1rem; }
            .sidebar.collapsed .sidebar-foot .hide-collapsed { display: flex; }
            .sidebar.collapsed .privacy-pill { padding: .3rem .7rem; }
            .sidebar.collapsed .privacy-pill span { display: inline; }
            .tool-link { padding: .75rem .65rem; }

            .backdrop {
                display: block; position: fixed; inset: 0; z-index: 30;
                background: rgba(15, 23, 42, .4); opacity: 0; pointer-events: none; transition: opacity .25s;
            }
            .backdrop.open { opacity: 1; pointer-events: auto; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#toolFrame">Skip to tool</a>

    <div class="backdrop" id="backdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Tools">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sidebar-head">
            <a href="index.html" class="brand" title="Aukmind home">
                <img class="brand-mark" src="logo.svg" alt="" width="28" height="28">
                <span class="brand-word">Aukmind</span>
            </a>
            <button class="icon-btn" id="collapseToggle" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar">
                <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7l-5 5 5 5"/></svg>
            </button>
        </div>

        <div class="nav-label">Tools</div>
        <nav class="nav" id="toolNav"></nav>

        <div class="sidebar-foot">
            <span class="privacy-pill" title="Files are processed on your device and never uploaded">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <span>100% in your browser</span>
            </span>
            <div class="foot-row hide-collapsed">
                <a href="index.html">&larr; aukmind.com</a>
                <span>&copy; <span class="year"></span> Aukmind</span>
            </div>
        </div>
    </aside>

    <main id="main">
        <iframe id="toolFrame" title="Tool" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        <div class="loader" id="loader" role="status">
            <div class="loader-inner"><div class="spinner"></div><span id="loaderText">Loading…</span></div>
        </div>
    </main>

    <div class="mobile-bar">
        <a href="index.html" class="brand" aria-label="Aukmind home"><img class="brand-mark" src="logo.svg" alt="" width="30" height="30"></a>
        <button class="current-tool" id="menuToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Switch tool">
            <span id="currentToolName">Tools</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5-5 5 5"/></svg>
        </button>
    </div>

    <script>
        const TOOLS = [
            { id: 'image', path: 'image/', name: 'Image Toolbox', desc: 'Convert HEIC, compress, crop, blur',
              icon: 'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3zM12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6z' },
            { id: 'pdf', path: 'pdfmerge/', name: 'PDF Editor', desc: 'Merge, reorder, edit, sign',
              icon: 'M12 22h6a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v10M14 2v4a2 2 0 0 0 2 2h4M10.4 12.6a2 2 0 1 1 3 3L8 21l-4 1 1-4z' },
            { id: 'linkedin', path: 'linkedin/', name: 'LinkedIn Text', desc: 'Bold and italic for posts',
              icon: 'M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.71 1.637-1.548 3.37-1.548 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z', filled: true },
        ];

        const $ = (id) => document.getElementById(id);
        const sidebar = $('sidebar'), backdrop = $('backdrop'), frame = $('toolFrame'), loader = $('loader');
        const menuToggle = $('menuToggle'), collapseToggle = $('collapseToggle');
        const mobile = window.matchMedia('(max-width: 767px)');
        const svg = (d, filled) => filled
            ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${d}"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

        document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());

        $('toolNav').innerHTML = TOOLS.map(t => `
            <a class="tool-link" href="#${t.id}" data-id="${t.id}" data-name="${t.name}">
                <span class="tool-icon">${svg(t.icon, t.filled)}</span>
                <span class="tool-text"><span class="tool-name">${t.name}</span><span class="tool-desc">${t.desc}</span></span>
            </a>`).join('');

        function setActive(tool) {
            document.querySelectorAll('.tool-link').forEach(el => {
                if (el.dataset.id === tool.id) el.setAttribute('aria-current', 'page');
                else el.removeAttribute('aria-current');
            });
            document.title = `${tool.name} · Aukmind Tools`;
            frame.title = tool.name;
            $('currentToolName').textContent = tool.name;
            localStorage.setItem('aukmind.tool', tool.id);
        }

        function route() {
            const id = location.hash.slice(1);
            const tool = TOOLS.find(t => t.id === id)
                || TOOLS.find(t => t.id === localStorage.getItem('aukmind.tool'))
                || TOOLS[0];
            if (id !== tool.id) history.replaceState(null, '', '#' + tool.id);
            setActive(tool);
            if (!frame.src.endsWith('/' + tool.path)) {
                $('loaderText').textContent = `Loading ${tool.name}…`;
                loader.classList.remove('done');
                frame.src = tool.path;
            }
            closeSheet();
        }

        // Tools link to each other (e.g. Image → PDF Editor), so follow the frame instead of assuming.
        frame.addEventListener('load', () => {
            loader.classList.add('done');
            let path;
            try { path = frame.contentWindow.location.pathname; } catch { return; }
            const tool = TOOLS.find(t => path.includes('/' + t.path));
            if (tool && location.hash !== '#' + tool.id) {
                history.replaceState(null, '', '#' + tool.id);
                setActive(tool);
            }
        });

        function openSheet() {
            sidebar.classList.add('open');
            backdrop.classList.add('open');
            menuToggle.setAttribute('aria-expanded', 'true');
            sidebar.querySelector('[aria-current]')?.focus();
        }
        function closeSheet() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('open');
            menuToggle.setAttribute('aria-expanded', 'false');
        }
        menuToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSheet() : openSheet());
        backdrop.addEventListener('click', closeSheet);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
        $('toolNav').addEventListener('click', (e) => {
            // Re-selecting the current tool should still close the sheet
            if (e.target.closest('.tool-link')?.getAttribute('href') === location.hash) closeSheet();
        });

        function setCollapsed(collapsed) {
            sidebar.classList.toggle('collapsed', collapsed);
            collapseToggle.setAttribute('aria-expanded', String(!collapsed));
            collapseToggle.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
            localStorage.setItem('aukmind.sidebarCollapsed', collapsed ? '1' : '0');
        }
        collapseToggle.addEventListener('click', () => setCollapsed(!sidebar.classList.contains('collapsed')));
        setCollapsed(localStorage.getItem('aukmind.sidebarCollapsed') === '1');

        window.addEventListener('hashchange', route);
        route();
    </script>
</body>
</html>
